# To be filled by the author(s) at the time of submission
# -------------------------------------------------------

# Title of the article:
#  - For a successful replication, it should be prefixed with "[Re]"
#  - For a failed replication, it should be prefixed with "[¬Re]"
#  - For other article types, no instruction (but please, not too long)
title: "[Re] Topological Loss Function for Image Segmentation"

# List of authors with name, orcid number, email and affiliation
# Affiliation "*" means contact author (required even for single-authored papers)
# To include author suffix format name as Last Suffix, First M.I. (e.g. Schackart III, Kenneth E.)
authors:
  - name: Dovydas Venclovas
    orcid: 0009-0006-1523-3853
    email: dhvenclovas@gmail.com
    affiliations: 1,*      # * is for contact author

# List of affiliations with code (corresponding to author affiliations), name
# and address. You can also use these affiliations to add text such as "Equal
# contributions" as name (with no address).
affiliations:
  - code:    1
    name:    University of Amsterdam
    address: Amsterdam, The Netherlands


# List of keywords (adding the programming language might be a good idea)
keywords: rescience c, python, topological data analysis, topological loss function, neural networks, deep learning

# Code URL and DOI/SWH (url is mandatory for replication, doi after acceptance)
# You can get a DOI for your code from Zenodo, or an SWH identifier from
# Software Heritage.
#   see https://guides.github.com/activities/citable-code/
code:
  - url: https://github.com/DovydasVe/topological-loss-rescience
  - doi: 
  - swh: 

# Data URL and DOI (optional if no data)
data:
  - url:
  - doi:

# Information about the original article that has been replicated
replication:
  - cite: "J. R. Clough, N. Byrne, I. Oksuz, V. A. Zimmer, J. A. Schnabel and A. P. King, 'A Topological Loss Function for Deep-Learning Based Image Segmentation Using Persistent Homology,' in IEEE Transactions on Pattern Analysis and Machine Intelligence, vol. 44, no. 12, pp. 8766-8778, 1 Dec. 2022."
  - bib:  Clough:2022
  - url:  https://ieeexplore.ieee.org/document/9186664/
  - doi:  10.1109/TPAMI.2020.3013679

# Don't forget to surround abstract with double quotes
abstract: "We present an independent replication of Clough et al. (2022), 'A Topological Loss Function for Deep-Learning Based Image Segmentation Using Persistent Homology.' We implement the topological post-processing framework from scratch and assess its performance across Experiment 1 (MNIST image denoising) and Experiment 3 (ACDC cardiac MRI myocardium segmentation). Our results confirm statistically significant classification accuracy improvements across all noise levels on MNIST and modest volumetric 3D Dice improvements (+0.41 percentage points on end-diastole and +0.30 percentage points on end-systole) on ACDC."

# Bibliography file (yours)
bibliography: bibliography.bib
  
# Type of the article
# Type can be:
#  * Editorial
#  * Letter
#  * Replication
type: Replication

# Scientific domain of the article (e.g. Computational Neuroscience)
#  (one domain only & try to be not overly specific)
domain: Segmentation

# Coding language (main one only if several)
language: Python

  
